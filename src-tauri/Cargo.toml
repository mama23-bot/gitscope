[package]
name = "gitscope"
version = "0.1.0"
description = "GitScope — visual Git explorer and interactive Git learning hub"
authors = ["GitScope"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gitscope_lib"
# Desktop-only: cdylib/staticlib нужны только для мобильных таргетов.
# Без cdylib GNU-линкер не упирается в лимит экспортируемых символов.
crate-type = ["rlib"]

[features]
default = ["desktop"]
# Всё, что требует Tauri. Git-движок и его тесты собираются без этой фичи.
desktop = [
    "dep:tauri",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-opener",
    "dep:tauri-plugin-window-state",
    "dep:rusqlite",
    "dep:uuid",
]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2.8.4", optional = true }
tauri-plugin-window-state = { version = "2.5.0", optional = true }
rusqlite = { version = "0.43.0", features = ["bundled"], optional = true }
uuid = { version = "1.29.3", features = ["v4"], optional = true }
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
